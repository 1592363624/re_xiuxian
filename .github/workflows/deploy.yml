name: Deploy to Windows Server

# 触发条件：推送 main/master 分支，或在 Actions 页面手动触发
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 超时保护（含服务器本地构建时间）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 为什么不直接在 workflow 里写一行 PowerShell（v2 的老做法）：
      #   Windows OpenSSH 默认 shell 是 cmd.exe，多行脚本会被拆成多条命令执行，
      #   只能压成一行，结果就是引号/转义地狱，日志里也没法读、没法调试。
      # 现在的做法：
      #   1. 真正的逻辑写在 scripts/deploy-bootstrap.ps1（可读、可本地测试、可行级注释）
      #   2. 这里把它转成 UTF-16LE 再 base64，交给 powershell -EncodedCommand
      #   3. base64 只含字母数字和 +/=，过 cmd.exe 完全不会被改写，也不需要引号
      # 引导脚本来自本次 checkout（不是服务器上的旧副本），所以即使服务器上的
      # deploy.ps1 已经坏了，下次 push 依然能拉到最新的引导逻辑并自愈。
      # 约束：deploy-bootstrap.ps1 必须保持纯 ASCII 且足够短 —— cmd.exe 命令行上限 8191 字符。
      #   经验成本：base64(UTF-16LE) 约等于源码字符数 × 2.67，超过 7000 就直接卡在编码步骤。
      #   所以脚本里只留一行式注释，详细来龙去脉写在这段注释里（YAML 注释不占载荷）。
      #   两处容易踩坑的修复逻辑，都已在脚本内保留一行说明：
      #     - AddPath 会先 Trim 掉注册表 PATH 项里的引号/占位符，并给 Test-Path 加
      #       -EA SilentlyContinue：畸形项报的是非终止错误，光靠 try/catch 仍会在
      #       CI 日志里刷一片红 "Illegal characters in path"，看着像失败其实不是；
      #     - sshd 在服务启动时快照 PATH，之后装的 Git/Node 在 SSH 会话里是缺的，
      #       所以要现场从注册表读 PATH 并补齐常见安装位置。
      - name: Encode bootstrap script
        id: enc
        run: |
          set -euo pipefail
          # .gitattributes forces CRLF for *.ps1 even on the Linux runner; CR is pure
          # payload waste here (PowerShell accepts LF), and UTF-16LE doubles every byte.
          b64=$(tr -d '\r' < scripts/deploy-bootstrap.ps1 | iconv -f UTF-8 -t UTF-16LE | base64 -w0)
          if [ ${#b64} -gt 7000 ]; then
            echo "::error::encoded bootstrap is ${#b64} chars (cmd.exe limit is 8191) - shorten scripts/deploy-bootstrap.ps1, keep prose in deploy.yml"
            exit 1
          fi
          echo "b64=$b64" >> "$GITHUB_OUTPUT"
          echo "encoded bootstrap: ${#b64} chars"

      # 所有构建（前端 build、后端 npm install）都在 Windows 服务器本地完成：
      #   CI 只做触发，耗时从 5 分钟降到 30 秒；避免 Ubuntu build -> Windows run 的跨平台问题；
      #   git 增量拉取网络占用低；回滚只需 git reset --hard HEAD~1
      # script_stop=true 保证脚本失败时 Action 报红（默认 false 会假绿）
      - name: Trigger Server-Side Deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script_stop: true
          # 输出已全部改成 UTF-8 英文，不再需要 debug 转储（debug=true 会把整段 base64 打进日志）
          debug: false
          timeout: 60s           # TCP 连接超时
          command_timeout: 30m   # 命令执行超时（含 npm install + build + 健康检查）
          script: "powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand ${{ steps.enc.outputs.b64 }}"
