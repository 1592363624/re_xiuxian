# 修仙 · nginx 维护模式拦截（示例片段，请按实际路径/站点块粘贴）
#
# 依赖：
#   1. deploy.ps1 部署开始写  <PROJECT>/server/maintenance.flag，成功后删除
#   2. 稳定维护页            <PROJECT>/client/maintenance.html
#      （deploy.ps1 从 client/public/maintenance.html 拷出；在 dist 外，构建清空 dist 时仍可读）
#   3. 前端静态根            通常是 <PROJECT>/client/dist
#   4. /api 与 /socket.io 反代到 Node（127.0.0.1:5000）
#
# 把 <PROJECT> 换成实际部署根，例如 C:/Users/Administrator/Desktop/re_xiuxian
# 宝塔用户可粘进站点 server 块；面板保存会重写主 conf，粘贴后请确认这段仍在。

server {
    listen 80;
    server_name _;

    root <PROJECT>/client/dist;
    index index.html;

    # ===== 维护模式开关 =====
    # flag 存在 → 页面请求改写为稳定维护页（在 dist 外，构建期间仍可读）
    # API 请求不在此拦截：Node 端 maintenance 中间件返回 503 {code:"MAINTENANCE"}，
    # 已打开的 SPA 由前端遮罩原地轮询等待恢复。
    set $maintenance 0;
    if (-f <PROJECT>/server/maintenance.flag) {
        set $maintenance 1;
    }

    # 单页应用路由（维护激活时改写为维护页）
    # 必须用 last 重新匹配 location，才能落到下面的 alias；
    # break 只会在当前 location 里按 root=dist 找文件，dist 清空期间会 404。
    location / {
        if ($maintenance = 1) {
            rewrite ^ /maintenance.html last;
        }
        try_files $uri $uri/ /index.html;
    }

    # 稳定维护页（rewrite 目标；root 是 dist，所以用 alias 指到 dist 外那份）
    location = /maintenance.html {
        alias <PROJECT>/client/maintenance.html;
        add_header Cache-Control "no-store";
    }

    # 后端 API 反向代理（维护期由 Node 中间件回 503）
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.IO（必须配 Upgrade；维护期拒绝新连接，已建立的连接靠 HTTP 指令 503 实际不可用）
    location /socket.io/ {
        if ($maintenance = 1) {
            return 503;
        }
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
